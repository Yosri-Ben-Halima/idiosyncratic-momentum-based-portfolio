# Render Blueprint: public research dashboard (no sign-in) on the free plan.
services:
  - type: web
    name: residual-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.dashboard --host 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
